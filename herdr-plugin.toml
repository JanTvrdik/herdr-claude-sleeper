id = "claude-sleeper"
name = "Claude Sleeper"
version = "0.1.0"
min_herdr_version = "0.9.2"
description = "Put an idle Claude Code session to sleep on demand"
platforms = ["linux"]

[[actions]]
id = "sleep-current"
title = "Sleep Claude in current pane"
contexts = ["pane"]
command = ["./bin/claude-sleeper", "--current", "--idle-hours", "0"]
